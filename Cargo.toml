[package]
edition = "2021"
name = "m5stack-atom-matrix-rust"
authors = ["Petr Gadorek <hahihula@gmail.com>"]
version = "0.1.0"
rust-version = "1.95.0"

[dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-hal = { version = "1.2.2", features = ["esp32", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "embassy"] }

[profile.release]
codegen-units = 1
debug = true
debug-assertions = true
lto = "fat"
